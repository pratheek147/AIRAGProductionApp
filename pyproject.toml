[project]
name = "ragproductionapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pratheek", email = "pratheekshankarsalian@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "inngest>=0.5.19",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-google-genai>=0.6.0",
    "llama-index-llms-google-genai>=0.11.3",
    "llama-index-readers-file>=0.7.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
ragproductionapp = "ragproductionapp:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
